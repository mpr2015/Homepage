<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Mission Control</title>

<meta name="theme-color" content="#0b0f14">

<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1828/1828884.png">


<style>

:root {

    --bg:#0b0f14;
    --panel:#141a22;
    --panel2:#19212b;

    --text:#f2f4f8;
    --muted:#8d98a7;

    --accent:#5aa9ff;
    --border:#27313d;

}


* {
    box-sizing:border-box;
}


body {

    margin:0;

    background:var(--bg);

    color:var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

}


.container {

    max-width:900px;

    margin:auto;

    padding:25px;

    padding-top:
        calc(25px + env(safe-area-inset-top));

    padding-bottom:
        calc(25px + env(safe-area-inset-bottom));

}



/* HEADER */


.header {

    font-size:34px;

    font-weight:700;

    letter-spacing:1px;

}


.subheader {

    color:var(--muted);

    margin-top:5px;

    margin-bottom:25px;

}



/* WEATHER */


.weather-panel {

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:18px;

    padding:20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

}


.location {

    color:var(--muted);

    font-size:12px;

    letter-spacing:2px;

}


.temperature {

    font-size:52px;

    font-weight:700;

}


.condition {

    color:var(--muted);

}


.weather-details {

    display:flex;

    gap:20px;

}


.weather-details div {

    text-align:center;

}


.weather-details span {

    display:block;

    font-size:11px;

    color:var(--muted);

}


.weather-details strong {

    font-size:16px;

}



@media(max-width:600px){

    .weather-panel{

        flex-direction:column;

        align-items:flex-start;

        gap:20px;

    }

}



/* FORECAST */


.forecast-panel {

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:18px;

    padding:18px;

    margin-bottom:30px;

}


.forecast-title {

    color:var(--muted);

    font-size:12px;

    letter-spacing:2px;

    margin-bottom:15px;

}


.forecast-grid {

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

}


.forecast-day {

    background:var(--panel2);

    border-radius:12px;

    padding:14px;

    text-align:center;

}


.forecast-name {

    color:var(--muted);

    font-size:12px;

}


.forecast-icon {

    font-size:30px;

    margin:8px;

}


.forecast-temp {

    font-weight:600;

}


.rain-small {

    color:var(--muted);

    font-size:12px;

    margin-top:5px;

}



@media(max-width:500px){

    .forecast-grid{

        grid-template-columns:1fr;

    }

}



/* DAILY FLOW */


.flow {

    background:var(--panel);

    border-radius:18px;

    padding:18px;

    margin-bottom:30px;

}


.flow-title {

    color:var(--muted);

    font-size:12px;

    letter-spacing:2px;

}


.progress {

    height:8px;

    background:#26313d;

    border-radius:10px;

    margin-top:12px;

}


.progress-bar {

    width:60%;

    height:100%;

    background:var(--accent);

}



/* SECTIONS */


.section {

    margin-bottom:32px;

}


.section-title {

    font-size:13px;

    letter-spacing:2px;

    color:var(--muted);

    margin-bottom:12px;

}



/* CARDS */


.grid {

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:14px;

}


.card {

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:16px;

    padding:16px;

    text-decoration:none;

    color:var(--text);

    transition:.15s;

}


.card:hover {

    transform:translateY(-3px);

    border-color:var(--accent);

}


.card-title {

    font-size:18px;

    font-weight:600;

}


.card-desc {

    font-size:13px;

    color:var(--muted);

    margin-top:6px;

}



/* FOOTER */


.footer {

    text-align:center;

    color:#687382;

    font-size:12px;

    margin-top:40px;

}


</style>

</head>


<body>


<div class="container">


<div class="header">
MISSION CONTROL
</div>


<div class="subheader">
<span id="date"></span>
</div>



<!-- WEATHER -->

<div class="weather-panel">


<div>

<div class="location">
SPRINGFIELD, VA
</div>


<div class="temperature">
<span id="temperature">--</span>°
</div>


<div class="condition" id="condition">
Loading weather...
</div>

</div>



<div class="weather-details">


<div>
<span>HIGH</span>
<strong id="high">--</strong>
</div>


<div>
<span>LOW</span>
<strong id="low">--</strong>
</div>


<div>
<span>RAIN</span>
<strong id="rain">--</strong>
</div>


</div>


</div>





<!-- THREE DAY FORECAST -->


<div class="forecast-panel">


<div class="forecast-title">
3 DAY OUTLOOK
</div>


<div class="forecast-grid">


<div class="forecast-day">

<div class="forecast-name" id="day1">
TODAY
</div>

<div class="forecast-icon" id="icon1">
☁️
</div>

<div class="forecast-temp" id="temp1">
--° / --°
</div>

<div class="rain-small" id="rain1">
--%
</div>

</div>



<div class="forecast-day">

<div class="forecast-name" id="day2">
TOMORROW
</div>

<div class="forecast-icon" id="icon2">
☁️
</div>

<div class="forecast-temp" id="temp2">
--° / --°
</div>

<div class="rain-small" id="rain2">
--%
</div>

</div>



<div class="forecast-day">

<div class="forecast-name" id="day3">
DAY 3
</div>

<div class="forecast-icon" id="icon3">
☁️
</div>

<div class="forecast-temp" id="temp3">
--° / --°
</div>

<div class="rain-small" id="rain3">
--%
</div>

</div>


</div>


</div>
